name: TaskBoard Python CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  REGISTRY: ghcr.io
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run backend tests
        run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build frontend
        run: npm install && npm run build
        working-directory: frontend
  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"  # image names must be lowercase
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker build -t ghcr.io/${{ env.OWNER }}/taskboard-backend:${{ github.sha }} ./backend
          docker build -t ghcr.io/${{ env.OWNER }}/taskboard-frontend:${{ github.sha }} ./frontend
      - name: Scan backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/taskboard-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/taskboard-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push images
        run: |
          docker push ghcr.io/${{ env.OWNER }}/taskboard-backend:${{ github.sha }}
          docker push ghcr.io/${{ env.OWNER }}/taskboard-frontend:${{ github.sha }}
  deploy:
    # Runs once `terraform apply` is done and the AWS_ROLE_ARN repo variable is set
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"  # image names must be lowercase
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Configure kubectl
        run: aws eks update-kubeconfig --region ap-south-1 --name taskboard-eks
      - uses: azure/setup-helm@v4
      - name: Deploy with Helm
        run: |
          helm upgrade --install taskboard ./helm/taskboard -n taskboard --create-namespace \
            -f helm/taskboard/values-aws.yaml \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/${{ env.OWNER }}/taskboard-backend \
            --set frontend.image=ghcr.io/${{ env.OWNER }}/taskboard-frontend \
            --wait --timeout 10m
